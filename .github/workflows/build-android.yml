name: Build Android APK

on:
  push:
    branches: [main, plasma-visualizer]
    paths:
      - 'app.js'
      - 'bass-wave.js'
      - 'plasma-visualizer.js'
      - 'fluid-visualizer.js'
      - 'index.html'
      - 'styles.css'
      - 'controls.css'
      - 'controls.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html app.js styles.css bass-wave.js plasma-visualizer.js fluid-visualizer.js controls.css controls.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sinestesia-visualizer-plasma-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

