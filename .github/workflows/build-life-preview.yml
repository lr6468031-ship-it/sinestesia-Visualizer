name: Build Proyecto de vida actualizado

on:
  push:
    branches: [main, fix/flama-habitos-y-tareas]
    paths:
      - 'proyecto-de-vida/**'
      - 'scripts/build-life-android.mjs'
      - 'scripts/configure-life-preview.mjs'
      - 'scripts/prepare-life-artifact.py'
      - 'scripts/life_preview_identity.py'
      - 'scripts/sign-life-preview.py'
      - '.github/life-preview-channel.json'
      - 'downloads/proyecto-de-vida-*-prueba*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-life-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Install locked dependencies
        run: npm ci
      - name: Test current Proyecto de vida sources
        run: node --test proyecto-de-vida/tests/*.test.mjs
      - name: Generate an independent test app
        run: |
          npm run build:life:android
          node scripts/configure-life-preview.mjs
      # Signing for distribution is done privately with the existing key.
      # A new runner's debug key must never replace the installed app's signer.
      - name: Validate native tests and release compilation
        working-directory: .cache/life-android/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify exact version and source, then prepare download
        id: artifact
        run: python3 scripts/prepare-life-artifact.py
      - name: Upload updated installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .cache/life-artifact/
          if-no-files-found: error
          retention-days: 30
