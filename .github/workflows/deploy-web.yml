name: Deploy Web Preview

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'bass-wave.js'
      - 'plasma-visualizer.js'
      - 'plasma-ultra-tuning.js'
      - 'fluid-visualizer.js'
      - 'visual-intensity.js'
      - 'plasma-webgl.js'
      - 'plasma-webgpu.js'
      - 'controls.css'
      - 'controls.js'
      - 'separation*'
      - 'scripts/**'
      - 'vendor/**'
      - 'package-lock.json'
      - 'package.json'
      - 'THIRD_PARTY.md'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Prepare site and verified AI model
        run: npm run build:web -- --outdir site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
