name: Deploy Web Preview

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'bass-wave.js'
      - 'plasma-visualizer.js'
      - 'fluid-visualizer.js'
      - 'visual-intensity.js'
      - 'plasma-webgl.js'
      - 'plasma-webgpu.js'
      - 'controls.css'
      - 'controls.js'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html app.js styles.css bass-wave.js plasma-visualizer.js fluid-visualizer.js visual-intensity.js plasma-webgl.js plasma-webgpu.js controls.css controls.js site/
          touch site/.nojekyll
          echo "Web preview assets:"
          ls -lh site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
