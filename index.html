<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Sinestesia Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="controls.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">SINestesia</p>
        <h1>Audio Visualizer</h1>
      </div>
    </header>

    <section class="visual-area">
      <div class="stage" aria-label="Visualizador de audio">
        <canvas id="visualizer"></canvas>

        <section id="musicDock" class="music-dock" aria-label="Controles de música">
          <button id="dockToggle" class="dock-toggle" type="button" aria-expanded="false" aria-controls="dockPanel">
            <span class="dock-grip" aria-hidden="true"></span>
            <span class="dock-compact-title" id="compactTrack">Sin canción</span>
            <span class="dock-chevron" aria-hidden="true">⌃</span>
          </button>

          <div id="dockPanel" class="dock-panel" hidden>
            <div class="dock-header-row">
              <div class="track-info">
                <span class="track-label">REPRODUCIENDO</span>
                <strong id="trackName">Sin canción cargada</strong>
              </div>

              <label class="dock-file-button">
                Buscar música
                <input id="audioFile" type="file" accept="audio/*" />
              </label>
            </div>

            <div class="transport-row">
              <button id="playPause" class="play-button" type="button" aria-label="Reproducir" disabled>▶</button>

              <div class="timeline-wrap">
                <input id="seekBar" class="seek-bar" type="range" min="0" max="1000" value="0" step="1" aria-label="Posición de la canción" disabled />
                <div class="time-row">
                  <span id="currentTime">0:00</span>
                  <span id="durationTime">0:00</span>
                </div>
              </div>
            </div>

            <p id="status" class="dock-status">Carga una canción para comenzar.</p>
          </div>
        </section>
      </div>

      <div class="meter-card" aria-label="Niveles de frecuencia">
        <div><span>Graves</span><strong id="bassValue">0</strong></div>
        <div><span>Medios</span><strong id="midValue">0</strong></div>
        <div><span>Agudos</span><strong id="trebleValue">0</strong></div>
      </div>

      <div class="detection-card" aria-live="polite">
        <span>Interpretación aproximada</span>
        <strong id="instrumentValue">Sin señal</strong>
        <small>Analiza timbre, ataque y distribución de frecuencias.</small>
      </div>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <script src="app.js"></script>
  <script src="controls.js"></script>
</body>
</html>
